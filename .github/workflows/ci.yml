name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python Analysis dependencies
        working-directory: ./python-analysis
        run: pip install -r requirements.txt

      - name: Run Python Analysis tests
        working-directory: ./python-analysis
        run: python -m pytest tests/ -v

      - name: Install Audio Analyzer dependencies
        working-directory: ./audio-analyzer
        run: pip install -r requirements.txt

      - name: Run Audio Analyzer tests
        working-directory: ./audio-analyzer
        env:
          PYTHONPATH: .
        run: pytest -v

  docker-build-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Audio Analyzer image
        uses: docker/build-push-action@v6
        with:
          context: ./audio-analyzer
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - python-tests
      - docker-build-check

    steps:
      - name: Write summary
        run: |
          {
            echo "## Audio Services CI Summary"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Python Tests | ${{ needs.python-tests.result }} |"
            echo "| Docker Build Check | ${{ needs.docker-build-check.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on critical job failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
